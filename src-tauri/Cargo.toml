[package]
name = "snowpaw"
version = "0.1.0"
description = "Tauri harness for your agents to thrive in"
license = "MIT"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The GTK that Tauri already builds on, named here to reach the window's title
# bar. It has to stay the version Tauri uses.
gtk = "0.18"
libc = "0.2"
# ureq-proto traces raw HTTP bytes, including credentials, below header redaction.
log = { version = "0.4", features = ["max_level_off"] }
openssl = "0.10"
secret-service = { version = "=5.2.0", default-features = false, features = ["rt-tokio-crypto-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["sync"] }
ureq = { version = "3.5", default-features = false, features = ["native-tls-no-default"] }
url = "2"
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
zeroize = "1"

# Small, fast release binary: the app is meant to stay lightweight.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
