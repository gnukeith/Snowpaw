[package]
name = "snowpaw"
version = "0.1.0"
description = "Tauri harness for your agents to thrive in"
license = "MIT"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# Small, fast release binary: the app is meant to stay lightweight.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
